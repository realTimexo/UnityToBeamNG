name: Bug / problem
description: Something does not work in Unity or BeamNG
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: One or two sentences. Screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Attach export_report.txt and beamng.log (drag them in here). Versions of Unity / BeamNG / the tool are in the report.
